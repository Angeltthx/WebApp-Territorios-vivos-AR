<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificación de coordenadas · Territorios Vivos AR</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #14161a;
        color: #e8e8ea;
        font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 14px; color: #9aa0ab; font-size: 13px; max-width: 80ch; }
      .views { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      figure { margin: 0; }
      figcaption { margin-top: 6px; font-size: 12px; color: #9aa0ab; }
      canvas {
        width: 440px;
        height: 640px;
        background: #0b0c0e;
        border: 1px solid #2a2d33;
        border-radius: 6px;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>¿Cae cada icono sobre su animal?</h1>
    <p>
      Los mismos <code>MarkerPin</code> que usa la app, montados sobre el mapa colocado con el
      tamaño y el plano exactos del anchor de MindAR. Si un halo no rodea a su animal en la vista
      de frente, las coordenadas del catálogo están mal.
    </p>
    <div class="views">
      <figure>
        <canvas id="flat" width="880" height="1280"></canvas>
        <figcaption>Ortográfica de frente — comprobación de coordenadas</figcaption>
      </figure>
      <figure>
        <canvas id="angled" width="880" height="1280"></canvas>
        <figcaption>En perspectiva — los iconos flotan sobre el papel</figcaption>
      </figure>
    </div>
    <script type="module" src="/src/verify.ts"></script>
  </body>
</html>
